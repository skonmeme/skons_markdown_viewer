<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>

  <rect x="20" y="20" width="230" height="150" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="34" y="44" font-weight="700">Font set</text>
  <text x="34" y="68">Latin: Georgia</text>
  <text x="34" y="88">Korean: AppleMyungjo</text>
  <text x="34" y="108">Monospace: System</text>
  <text x="34" y="128">Size 17 · Line height 1.7</text>
  <text x="34" y="152" fill="#57606a">settings.rs (smv-core)</text>

  <rect x="300" y="20" width="580" height="150" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="314" y="44" font-weight="700">User stylesheet (style.rs)</text>
  <g font-family="Menlo, monospace" font-size="11">
    <text x="314" y="68">@font-face { font-family: "smv-korean"; src: local("AppleMyungjo");</text>
    <text x="330" y="84">font-weight: 400; unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF, … }</text>
    <text x="314" y="108">--smv-font-body: "smv-korean", "Georgia", "AppleMyungjo", sans-serif;</text>
    <text x="314" y="128">--smv-font-mono: "smv-korean", ui-monospace, Menlo, "AppleMyungjo", monospace;</text>
  </g>
  <text x="314" y="152" fill="#57606a">one @font-face per installed face of the Korean family (NSFontManager, fonts.rs)</text>
  <line x1="250" y1="95" x2="298" y2="95" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="20" y="200" width="860" height="110" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="34" y="224" font-weight="700">Result in the page</text>
  <text x="34" y="268" font-size="30"><tspan font-family="Georgia, serif" fill="#0969da">Markdown </tspan><tspan font-family="AppleMyungjo, serif" fill="#cf222e">마크다운</tspan><tspan font-family="Georgia, serif" fill="#0969da"> viewer 2026 </tspan><tspan font-family="AppleMyungjo, serif" fill="#cf222e">뷰어</tspan></text>
  <text x="34" y="296" fill="#57606a"><tspan fill="#0969da">blue</tspan>: Latin font (letters, digits, punctuation) · <tspan fill="#cf222e">red</tspan>: Korean font (Hangul only, through unicode-range)</text>
</svg>
