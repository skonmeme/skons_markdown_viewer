<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- lifelines -->
  <g font-weight="600" text-anchor="middle">
    <rect x="20" y="16" width="130" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="85" y="38">Finder / ⌘O</text>
    <rect x="170" y="16" width="150" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="245" y="38">NSDocumentController</text>
    <rect x="340" y="16" width="120" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="400" y="38">Document</text>
    <rect x="480" y="16" width="140" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="550" y="38">ViewerController</text>
    <rect x="640" y="16" width="110" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="695" y="38">WKWebView</text>
    <rect x="770" y="16" width="120" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="830" y="38">SchemeHandler</text>
  </g>
  <g stroke="#d0d7de" stroke-dasharray="4 4">
    <line x1="85" y1="50" x2="85" y2="455"/>
    <line x1="245" y1="50" x2="245" y2="455"/>
    <line x1="400" y1="50" x2="400" y2="455"/>
    <line x1="550" y1="50" x2="550" y2="455"/>
    <line x1="695" y1="50" x2="695" y2="455"/>
    <line x1="830" y1="50" x2="830" y2="455"/>
  </g>

  <g stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="85" y1="78" x2="243" y2="78"/>
    <line x1="245" y1="110" x2="398" y2="110"/>
    <line x1="245" y1="146" x2="398" y2="146"/>
    <line x1="400" y1="182" x2="548" y2="182"/>
    <line x1="550" y1="218" x2="693" y2="218"/>
    <line x1="695" y1="254" x2="828" y2="254"/>
    <line x1="830" y1="290" x2="552" y2="290"/>
    <line x1="552" y1="350" x2="828" y2="350"/>
    <line x1="830" y1="380" x2="697" y2="380"/>
    <line x1="695" y1="420" x2="552" y2="420"/>
  </g>
  <g>
    <text x="96" y="72">open file URL</text>
    <text x="256" y="104">init + readFromData: (decode UTF-8/16)</text>
    <text x="256" y="140">makeWindowControllers</text>
    <text x="411" y="176">new: window, find bar, web view</text>
    <text x="561" y="212">loadRequest(smv://local/&lt;path&gt;)</text>
    <text x="706" y="248">start task</text>
    <text x="590" y="284">page_for_path(path)</text>
    <rect x="560" y="296" width="250" height="38" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="685" y="311" text-anchor="middle">markdown::render + style::user_stylesheet</text>
    <text x="685" y="327" text-anchor="middle">+ page::page → complete HTML</text>
    <text x="600" y="346">HTML</text>
    <text x="708" y="374">200 text/html</text>
    <text x="560" y="414">didFinishNavigation → viewer.js ready</text>
    <text x="380" y="446" fill="#57606a">Images and media are later requested from the same handler as local files.</text>
  </g>
</svg>
