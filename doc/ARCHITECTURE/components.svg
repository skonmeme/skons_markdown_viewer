<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- AppKit layer -->
  <rect x="10" y="10" width="640" height="200" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="24" y="32" font-weight="700" fill="#57606a">crates/app · AppKit (objc2)</text>
  <g fill="#ffffff" stroke="#0969da" stroke-width="1.4">
    <rect x="24" y="44" width="190" height="60" rx="8"/>
    <rect x="232" y="44" width="190" height="60" rx="8"/>
    <rect x="440" y="44" width="196" height="60" rx="8"/>
    <rect x="24" y="126" width="190" height="66" rx="8"/>
    <rect x="232" y="126" width="190" height="66" rx="8"/>
    <rect x="440" y="126" width="196" height="66" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="119" y="68" font-weight="600">AppDelegate · menu</text>
    <text x="119" y="86">launch, menus, Open Recent</text>
    <text x="327" y="68" font-weight="600">NSDocumentController</text>
    <text x="327" y="86">open, recent files, tabs</text>
    <text x="538" y="68" font-weight="600">Document (NSDocument)</text>
    <text x="538" y="86">read file, watch, print</text>
    <text x="119" y="150" font-weight="600">SettingsController</text>
    <text x="119" y="168">Settings window</text>
    <text x="119" y="184" fill="#57606a">settings_store · fonts</text>
    <text x="327" y="150" font-weight="600">help</text>
    <text x="327" y="168">usage guide by</text>
    <text x="327" y="184">system language</text>
    <text x="538" y="150" font-weight="600">ViewerController</text>
    <text x="538" y="168">window, find bar,</text>
    <text x="538" y="184">links, JS bridge</text>
  </g>

  <!-- WebKit layer -->
  <rect x="10" y="226" width="640" height="122" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="24" y="248" font-weight="700" fill="#57606a">WebKit</text>
  <g fill="#ffffff" stroke="#8250df" stroke-width="1.4">
    <rect x="24" y="260" width="190" height="72" rx="8"/>
    <rect x="232" y="260" width="190" height="72" rx="8"/>
    <rect x="440" y="260" width="196" height="72" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="119" y="286" font-weight="600">SchemeHandler</text>
    <text x="119" y="304">smv://local/&lt;path&gt;</text>
    <text x="119" y="320" fill="#57606a">page or local file</text>
    <text x="327" y="286" font-weight="600">WKWebView</text>
    <text x="327" y="304">page JavaScript off</text>
    <text x="327" y="320" fill="#57606a">one per window</text>
    <text x="538" y="286" font-weight="600">viewer.js</text>
    <text x="538" y="304">isolated world "smv"</text>
    <text x="538" y="320" fill="#57606a">update · find · style</text>
  </g>

  <!-- core layer -->
  <rect x="10" y="364" width="640" height="186" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="636" y="386" font-weight="700" fill="#57606a" text-anchor="end">crates/core · smv-core (no macOS API)</text>
  <g fill="#ffffff" stroke="#1a7f37" stroke-width="1.4">
    <rect x="24" y="398" width="146" height="62" rx="8"/>
    <rect x="182" y="398" width="146" height="62" rx="8"/>
    <rect x="340" y="398" width="146" height="62" rx="8"/>
    <rect x="498" y="398" width="138" height="62" rx="8"/>
    <rect x="24" y="474" width="146" height="62" rx="8"/>
    <rect x="182" y="474" width="146" height="62" rx="8"/>
    <rect x="340" y="474" width="146" height="62" rx="8"/>
    <rect x="498" y="474" width="138" height="62" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="97" y="424" font-weight="600">markdown</text>
    <text x="97" y="442">comrak (GFM)</text>
    <text x="255" y="424" font-weight="600">highlight</text>
    <text x="255" y="442">syntect + two-face</text>
    <text x="413" y="424" font-weight="600">style</text>
    <text x="413" y="442">settings → CSS</text>
    <text x="567" y="424" font-weight="600">page</text>
    <text x="567" y="442">HTML + base.css</text>
    <text x="97" y="500" font-weight="600">settings</text>
    <text x="97" y="518">font sets, colors</text>
    <text x="255" y="500" font-weight="600">url</text>
    <text x="255" y="518">path ↔ smv: URL</text>
    <text x="413" y="500" font-weight="600">text</text>
    <text x="413" y="518">UTF-8 / UTF-16</text>
    <text x="567" y="500" font-weight="600">assets</text>
    <text x="567" y="518">base.css, viewer.js</text>
  </g>

  <!-- build -->
  <rect x="670" y="10" width="220" height="540" rx="10" fill="#fff8f0" stroke="#d4a72c"/>
  <text x="684" y="32" font-weight="700" fill="#7d4e00">Build &amp; release</text>
  <g fill="#ffffff" stroke="#bf8700" stroke-width="1.4">
    <rect x="684" y="44" width="192" height="80" rx="8"/>
    <rect x="684" y="140" width="192" height="96" rx="8"/>
    <rect x="684" y="252" width="192" height="80" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="780" y="68" font-weight="600">xtask</text>
    <text x="780" y="86">bundle · run · dist</text>
    <text x="780" y="104">notarize · version</text>
    <text x="780" y="164" font-weight="600">packaging/</text>
    <text x="780" y="182">Info.plist · AppIcon.icon</text>
    <text x="780" y="200">help · installer</text>
    <text x="780" y="218">uninstaller</text>
    <text x="780" y="276" font-weight="600">.github/workflows</text>
    <text x="780" y="294">release.yml</text>
    <text x="780" y="312">sign · notarize · publish</text>
  </g>

  <!-- arrows -->
  <g stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="422" y1="74" x2="438" y2="74"/>
    <line x1="538" y1="104" x2="538" y2="124"/>
    <line x1="538" y1="192" x2="538" y2="258"/>
    <line x1="440" y1="296" x2="424" y2="296"/>
    <line x1="232" y1="296" x2="216" y2="296"/>
    <line x1="119" y1="332" x2="119" y2="396"/>
    <path d="M214,159 C300,230 420,230 470,258"/>
  </g>
</svg>
