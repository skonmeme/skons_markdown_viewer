<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 734" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="734" fill="#ffffff"/>

  <!-- AppKit layer -->
  <rect x="10" y="10" width="640" height="298" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="24" y="32" font-weight="700" fill="#57606a">crates/app · AppKit (objc2), Swift bridge</text>
  <g fill="#ffffff" stroke="#0969da" stroke-width="1.4">
