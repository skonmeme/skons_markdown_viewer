<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="860" height="330" fill="#ffffff"/>

  <!-- lanes -->
  <rect x="10" y="30" width="840" height="110" rx="8" fill="#f6f8fa"/>
  <rect x="10" y="152" width="840" height="74" rx="8" fill="#f6f8fa"/>
  <rect x="10" y="238" width="840" height="74" rx="8" fill="#f6f8fa"/>
  <g font-weight="600" fill="#57606a">
    <text x="24" y="54">Working branch</text>
    <text x="24" y="176">develop</text>
    <text x="24" y="262">main</text>
  </g>

  <!-- working branch steps -->
  <g fill="#ffffff" stroke="#0969da" stroke-width="1.5">
    <rect x="140" y="62" width="165" height="56" rx="8"/>
    <rect x="321" y="62" width="165" height="56" rx="8"/>
    <rect x="502" y="62" width="165" height="56" rx="8"/>
    <rect x="683" y="62" width="165" height="56" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="222.5" y="86" font-weight="600">1. Commit the request</text>
    <text x="222.5" y="104">in spec/requests/</text>
    <text x="403.5" y="86" font-weight="600">2. Update STANDARD.md</text>
    <text x="403.5" y="104">and the source code</text>
    <text x="584.5" y="86" font-weight="600">3. Move the request</text>
    <text x="584.5" y="104">to spec/merged/</text>
    <text x="765.5" y="86" font-weight="600">4. Commit automatically</text>
    <text x="765.5" y="104">if no problem occurs</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="305" y1="90" x2="319" y2="90"/>
    <line x1="486" y1="90" x2="500" y2="90"/>
    <line x1="667" y1="90" x2="681" y2="90"/>
    <path d="M765.5,118 V138 C765.5,160 690,152 642,170"/>
    <line x1="560" y1="210" x2="560" y2="248"/>
    <line x1="640" y1="271" x2="681" y2="271"/>
  </g>
  <text x="774" y="146" fill="#57606a">merge</text>
  <text x="568" y="234" fill="#57606a">pull request merged</text>

  <!-- develop and main -->
  <g fill="#ffffff" stroke="#57606a" stroke-width="1.5">
    <rect x="480" y="168" width="160" height="42" rx="8"/>
    <rect x="480" y="250" width="160" height="42" rx="8"/>
  </g>
  <text x="560" y="194" text-anchor="middle" font-weight="600">Development</text>
  <text x="560" y="276" text-anchor="middle" font-weight="600">Released state</text>

  <!-- release -->
  <rect x="683" y="250" width="165" height="42" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="765.5" y="268" text-anchor="middle" font-weight="600">Release</text>
  <text x="765.5" y="284" text-anchor="middle">installer + uninstaller .pkg</text>

  <text x="140" y="200" fill="#cf222e">No work is done directly on develop or main.</text>
</svg>
