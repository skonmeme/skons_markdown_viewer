    <rect x="130" y="182" width="380" height="8" rx="2"/>
    <rect x="130" y="198" width="244" height="8" rx="2"/>
    <rect x="130" y="258" width="380" height="8" rx="2"/>
    <rect x="130" y="274" width="364" height="8" rx="2"/>
