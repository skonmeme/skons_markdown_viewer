# Publishes a signed and notarized release when a pull request is merged into
# main (STANDARD §10, §11.4).
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: macos-26
    env:
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.MERGE_SHA }}

      - name: Check the version
        run: |
          version="$(cargo xtask version)"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::Release v$version already exists. Raise the version in Cargo.toml."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Import the signing identities
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_P12" ] || [ -z "$DEVELOPER_ID_P12_PASSWORD" ]; then
            echo "::error::DEVELOPER_ID_P12 and DEVELOPER_ID_P12_PASSWORD are required; unsigned packages are never released."
            exit 1
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
          done
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          app_identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          pkg_identity="$(security find-identity -v "$keychain" | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)"
          if [ -z "$app_identity" ] || [ -z "$pkg_identity" ]; then
            echo "::error::DEVELOPER_ID_P12 must contain the Developer ID Application and Developer ID Installer identities."
            exit 1
          fi
          echo "SMV_SIGN_APP_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "SMV_SIGN_PKG_IDENTITY=$pkg_identity" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Prepare the notarization key
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; then
            echo "::error::NOTARY_KEY, NOTARY_KEY_ID and NOTARY_ISSUER_ID are required; unnotarized packages are never released."
            exit 1
          fi
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$NOTARY_KEY" > "$key"
          echo "SMV_NOTARY_KEY=$key" >> "$GITHUB_ENV"
          echo "SMV_NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "SMV_NOTARY_ISSUER=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      # The Swift bridge to the Foundation Models framework uses
      # SystemLanguageModel.contextSize, which needs the macOS 26.4 SDK
      # (STANDARD §6.6).
      - name: Select an Xcode with the macOS 26.4 SDK or later
        run: |
          need=26.4
          sdk_ok() { [ "$(printf '%s\n' "$need" "$(xcrun --sdk macosx --show-sdk-version)" | sort -V | head -1)" = "$need" ]; }
          if ! sdk_ok; then
            for xcode in $(ls -d /Applications/Xcode*.app 2>/dev/null | grep -vi beta | sort -rV); do
              sudo xcode-select -s "$xcode/Contents/Developer"
              if sdk_ok; then break; fi
            done
          fi
          if ! sdk_ok; then
            echo "::error::No Xcode with the macOS $need SDK or later is installed."
            exit 1
          fi
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      - name: Test
        run: cargo test --workspace

      - name: Build, sign and notarize the packages
        run: |
          cargo xtask dist
          cargo xtask notarize
          for package in target/dist/*.pkg; do
            pkgutil --check-signature "$package"
            spctl --assess --type install --verbose "$package"
          done

      - name: Publish the release
        run: |
          gh release create "v$VERSION" target/dist/*.pkg \
            --target "$MERGE_SHA" \
            --title "skon's Markdown Viewer $VERSION" \
            --generate-notes

      - name: Remove the keychain and key
        if: always()
        run: |
          if [ -n "$RELEASE_KEYCHAIN" ]; then security delete-keychain "$RELEASE_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary-key.p8"
