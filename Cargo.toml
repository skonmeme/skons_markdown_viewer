[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "xtask"]
default-members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
smv-core = { path = "crates/core" }

comrak = { version = "0.57", default-features = false, features = ["syntect-onig"] }
syntect = { version = "5.3", default-features = false, features = ["default-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-web-kit = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
